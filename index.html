const names={music:"🎵 MUSIC",hype:"🔥 HYPE",repeat:"🗿 REPEAT",beat:"🎧 BEAT",album:"💿 ALBUM",streaming:"📡 STREAMING",performance:"🎤 PERFORMANCE"};
const used={id:{},en:{}};for(const l of ["id","en"])for(const v of Object.keys(captions[l]))used[l][v]=new Set();
let current="";
const $=x=>document.getElementById(x);
function update(){let l=$("lang").value,v=$("vibe").value;$("badge").textContent=names[v];$("count").textContent=used[l][v].size+" / "+captions[l][v].length+" used"}
function personalize(t){return t.replaceAll("LISA",$("name").value.trim()||"LISA").replaceAll("PRESS PLAY",$("moment").value.trim()||"PRESS PLAY")}
function tagged(t){let x=$("tags").value.trim();return x?t+"\n\n"+x:t}
function generate(){let l=$("lang").value,v=$("vibe").value,a=captions[l][v],s=used[l][v];if(s.size>=a.length)s.clear();let i;do{i=Math.floor(Math.random()*a.length)}while(s.has(i));s.add(i);current=personalize(a[i]);$("out").className="";$("out").textContent=tagged(current);update()}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){let x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}let q=$("toast");q.classList.add("show");setTimeout(()=>q.classList.remove("show"),1300)}
$("gen").onclick=generate;
$("copy").onclick=()=>current?copyText(tagged(current)):copyText("Generate caption dulu.");
$("copyall").onclick=()=>{let l=$("lang").value,v=$("vibe").value;copyText(captions[l][v].map((x,i)=>(i+1)+". "+personalize(x)).join("\n\n")+"\n\n"+$("tags").value.trim())};
$("lang").onchange=()=>{current="";$("out").className="empty";$("out").textContent="Tekan GENERATE CAPTION untuk mulai.";update()};
$("vibe").onchange=()=>{current="";$("out").className="empty";$("out").textContent="Tekan GENERATE CAPTION untuk mulai.";update()};
update();
</script>
