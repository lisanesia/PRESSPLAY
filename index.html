<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LISA — PRESS PLAY Caption Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #25202b 0%, #0b0b0f 45%, #050507 100%);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  width: min(850px, 92%);
  margin: auto;
  padding: 40px 0 60px;
}

.header {
  text-align: center;
  margin-bottom: 30px;
}

.mini {
  font-size: 11px;
  letter-spacing: 4px;
  color: #999;
  margin-bottom: 10px;
}

h1 {
  margin: 0;
  font-size: clamp(34px, 8vw, 60px);
  letter-spacing: -3px;
}

.header p {
  color: #999;
  margin-top: 12px;
}

.card {
  background: rgba(18,18,23,.92);
  border: 1px solid #2c2c34;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  color: #aaa;
  font-size: 11px;
  margin-bottom: 7px;
  letter-spacing: .5px;
}

input,
select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #36363f;
  background: #0d0d11;
  color: #fff;
  outline: none;
  font-size: 14px;
}

input:focus,
select:focus {
  border-color: #77717f;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 13px 17px;
  cursor: pointer;
  font-weight: 700;
  background: #fff;
  color: #08080a;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
  opacity: .9;
}

button.secondary {
  background: #27272f;
  color: #fff;
  border: 1px solid #383841;
}

.result {
  min-height: 150px;
  padding: 20px;
  border-radius: 14px;
  background: #0d0d11;
  border: 1px solid #292930;
  font-size: 18px;
  line-height: 1.7;
  white-space: pre-wrap;
}

.tags {
  margin-top: 14px;
  color: #aaa;
  line-height: 1.6;
  word-break: break-word;
}

.counter {
  margin-top: 10px;
  color: #666672;
  font-size: 11px;
}

.footer {
  text-align: center;
  color: #55555f;
  font-size: 11px;
  margin-top: 28px;
}

@media (max-width: 650px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .container {
    padding-top: 28px;
  }

  .card {
    padding: 16px;
  }

  button {
    flex: 1;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="mini">LISANESIA</div>
    <h1>LISA — PRESS PLAY</h1>
    <p>Bilingual Caption Generator • 100 Captions</p>
  </div>

  <div class="card">

    <div class="grid">

      <div>
        <label>LANGUAGE / BAHASA</label>
        <select id="language">
          <option value="id">🇮🇩 Bahasa Indonesia</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </div>

      <div>
        <label>VIBE</label>
        <select id="vibe">
          <option value="elegan">✨ Elegant</option>
          <option value="music">🎵 Music</option>
          <option value="hype">🔥 Hype / Support</option>
          <option value="powerful">⚡ Powerful</option>
          <option value="short">🖤 Short</option>
        </select>
      </div>

      <div>
        <label>NAMA</label>
        <input
          id="name"
          value="LISA"
          placeholder="LISA"
        >
      </div>

      <div>
        <label>MOMEN / ALBUM</label>
        <input
          id="moment"
          value="PRESS PLAY"
          placeholder="PRESS PLAY"
        >
      </div>

      <div class="full">
        <label>HASHTAG — BISA DIEDIT LANGSUNG</label>
        <input
          id="hashtags"
          value="#LISA #PRESSPLAY"
          placeholder="#LISA #PRESSPLAY"
        >
      </div>

    </div>

    <div class="buttons">
      <button onclick="generateCaption()">
        🎲 Generate Caption
      </button>

      <button class="secondary" onclick="copyCaption()">
        📋 Copy Caption
      </button>

      <button class="secondary" onclick="copyAll()">
        📋 Copy All
      </button>
    </div>

  </div>


  <div class="card">

    <div id="result" class="result">
      Klik "Generate Caption" untuk mendapatkan caption.
    </div>

    <div id="tags" class="tags"></div>

    <div id="counter" class="counter"></div>

  </div>


  <div class="footer">
    LISA • PRESS PLAY • LISANESIA
  </div>

</div>


<script>

/* =========================================================
   VIBE
   Versi ringan: vibe tetap tersedia.
   Caption dipilih dari seluruh database.
========================================================= */

const used = {
  id: new Set(),
  en: new Set()
};

let currentCaption = "";


/* =========================================================
   GENERATE
========================================================= */

function generateCaption() {

  const language =
    document.getElementById("language").value;

  const name =
    document.getElementById("name").value.trim() || "LISA";

  const moment =
    document.getElementById("moment").value.trim() || "PRESS PLAY";

  const hashtags =
    document.getElementById("hashtags").value.trim();

  const list = captions[language];

  /* Reset setelah semua caption dipakai */
  if (used[language].size >= list.length) {
    used[language].clear();
  }

  let randomIndex;

  do {

    randomIndex =
      Math.floor(Math.random() * list.length);

  } while (
    used[language].has(randomIndex)
  );

  used[language].add(randomIndex);

  currentCaption =
    list[randomIndex]
      .replaceAll("LISA", name)
      .replaceAll("PRESS PLAY", moment);

  document.getElementById("result").textContent =
    currentCaption;

  document.getElementById("tags").textContent =
    hashtags;

  document.getElementById("counter").textContent =
    `${used[language].size} / ${list.length} caption digunakan`;

}


/* =========================================================
   COPY CAPTION
========================================================= */

function copyCaption() {

  if (!currentCaption) {
    generateCaption();
  }

  navigator.clipboard.writeText(currentCaption);

}


/* =========================================================
   COPY CAPTION + HASHTAG
========================================================= */

function copyAll() {

  if (!currentCaption) {
    generateCaption();
  }

  const hashtags =
    document.getElementById("hashtags").value.trim();

  const finalText =
    hashtags
      ? currentCaption + "\n\n" + hashtags
      : currentCaption;

  navigator.clipboard.writeText(finalText);

}

</script>

</body>
  </html>
