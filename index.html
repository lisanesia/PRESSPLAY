<!DOCTYPE html>
<html lang="id">
<head>

<title>LISA — PRESS PLAY</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --yellow:#ffd21c;
  --yellow2:#ffea75;
  --dark:#050505;
  --card:rgba(18,18,18,.78);
  --card2:rgba(25,25,25,.65);
  --line:rgba(255,210,28,.16);
  --text:#fff;
  --muted:#929292;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -15%,rgba(255,210,28,.20),transparent 32%),
    radial-gradient(circle at 5% 45%,rgba(255,210,28,.07),transparent 25%),
    radial-gradient(circle at 95% 80%,rgba(255,210,28,.06),transparent 28%),
    #050505;
  overflow-x:hidden;
}

/* BACKGROUND */

body::before{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  left:50%;
  top:-300px;
  transform:translateX(-50%);
  border-radius:50%;
  background:var(--yellow);
  filter:blur(180px);
  opacity:.13;
  pointer-events:none;
  animation:pulseGlow 5s ease-in-out infinite alternate;
  z-index:-3;
}

@keyframes pulseGlow{
  from{opacity:.08;transform:translateX(-50%) scale(.9)}
  to{opacity:.18;transform:translateX(-50%) scale(1.1)}
}

/* MOVING LIGHT */

.light{
  position:fixed;
  width:350px;
  height:350px;
  border-radius:50%;
  background:var(--yellow);
  filter:blur(180px);
  opacity:.045;
  pointer-events:none;
  z-index:-2;
  animation:moveLight 16s ease-in-out infinite alternate;
}

@keyframes moveLight{
  0%{left:-200px;top:30%}
  50%{left:60%;top:10%}
  100%{left:80%;top:70%}
}

/* PARTICLES */

.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:-1;
}

.particle{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:var(--yellow);
  opacity:.25;
  animation:particleFloat linear infinite;
}

@keyframes particleFloat{
  from{
    transform:translateY(110vh) scale(.5);
    opacity:0;
  }
  15%{opacity:.3}
  80%{opacity:.2}
  to{
    transform:translateY(-15vh) scale(1);
    opacity:0;
  }
}

/* CONTAINER */

.container{
  width:min(900px,92%);
  margin:auto;
  padding:42px 0 65px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:28px;
}

.brand{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 14px;
  border:1px solid rgba(255,210,28,.25);
  border-radius:999px;
  color:var(--yellow);
  background:rgba(255,210,28,.045);
  box-shadow:0 0 25px rgba(255,210,28,.06);
  font-size:10px;
  font-weight:700;
  letter-spacing:4px;
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--yellow);
  box-shadow:0 0 10px var(--yellow);
  animation:blink 1.2s infinite;
}

@keyframes blink{
  50%{opacity:.25}
}

h1{
  margin:18px 0 0;
  font-size:clamp(38px,8vw,72px);
  letter-spacing:-4px;
  line-height:.95;
  color:#fff;
  text-shadow:
    0 0 15px rgba(255,210,28,.12),
    0 0 45px rgba(255,210,28,.08);
}

h1 span{
  color:var(--yellow);
}

.subtitle{
  color:#888;
  font-size:13px;
  margin-top:14px;
}

.stats{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:17px;
}

.stat{
  padding:7px 11px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  color:#898989;
  background:rgba(255,255,255,.025);
  font-size:9px;
  letter-spacing:1px;
}

/* EQUALIZER */

.equalizer{
  height:42px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:4px;
  margin:22px 0 3px;
}

.bar{
  width:4px;
  border-radius:10px 10px 2px 2px;
  background:var(--yellow);
  box-shadow:0 0 9px rgba(255,210,28,.55);
  animation:eq 1s ease-in-out infinite alternate;
}

.bar:nth-child(1){height:12px;animation-delay:.1s}
.bar:nth-child(2){height:24px;animation-delay:.3s}
.bar:nth-child(3){height:17px;animation-delay:.5s}
.bar:nth-child(4){height:34px;animation-delay:.15s}
.bar:nth-child(5){height:21px;animation-delay:.4s}
.bar:nth-child(6){height:29px;animation-delay:.25s}
.bar:nth-child(7){height:14px;animation-delay:.6s}
.bar:nth-child(8){height:26px;animation-delay:.35s}
.bar:nth-child(9){height:18px;animation-delay:.5s}

@keyframes eq{
  from{
    transform:scaleY(.35);
    opacity:.45;
  }
  to{
    transform:scaleY(1);
    opacity:1;
  }
}

/* CARD */

.card{
  position:relative;
  margin-bottom:16px;
  padding:22px;
  border-radius:24px;
  border:1px solid var(--line);
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012) 45%,
      rgba(255,210,28,.025)
    ),
    var(--card);
  box-shadow:
    0 25px 80px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(22px);
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  left:-30%;
  top:0;
  width:30%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--yellow),
    transparent
  );
  animation:scan 5s linear infinite;
  opacity:.7;
}

@keyframes scan{
  from{left:-30%}
  to{left:110%}
}

/* FORM */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  color:#929292;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.4px;
  margin-bottom:8px;
}

input,
select{
  width:100%;
  padding:14px 15px;
  border-radius:13px;
  border:1px solid #303030;
  outline:none;
  color:#fff;
  background:#0b0b0b;
  font-size:14px;
  transition:.25s;
}

input::placeholder{
  color:#505050;
}

input:hover,
select:hover{
  border-color:rgba(255,210,28,.25);
}

input:focus,
select:focus{
  border-color:var(--yellow);
  box-shadow:
    0 0 0 3px rgba(255,210,28,.06),
    0 0 22px rgba(255,210,28,.07);
}

select option{
  background:#101010;
  color:#fff;
}

/* BUTTONS */

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:19px;
}

button{
  position:relative;
  overflow:hidden;
  border:0;
  border-radius:13px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:800;
  font-size:13px;
  color:#050505;
  background:var(--yellow);
  transition:.2s;
  box-shadow:0 0 0 rgba(255,210,28,0);
}

button::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.45),
    transparent
  );
  transform:skewX(-20deg);
  transition:.45s;
}

button:hover::after{
  left:130%;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:
    0 8px 28px rgba(255,210,28,.18);
}

button:active{
  transform:scale(.97);
}

button.secondary{
  color:#ddd;
  background:#1b1b1b;
  border:1px solid #343434;
  box-shadow:none;
}

button.secondary:hover{
  border-color:rgba(255,210,28,.3);
  color:var(--yellow);
}

/* RESULT */

.result-label{
  display:flex;
  align-items:center;
  gap:8px;
  color:#737373;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:11px;
}

.result-label::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--yellow);
  box-shadow:0 0 10px var(--yellow);
}

.result{
  min-height:175px;
  padding:22px;
  border-radius:17px;
  border:1px solid #292929;
  background:
    radial-gradient(
      circle at top right,
      rgba(255,210,28,.055),
      transparent 35%
    ),
    #0a0a0a;
  font-size:18px;
  line-height:1.75;
  white-space:pre-wrap;
  color:#f4f4f4;
  transition:.25s;
}

.result.show{
  animation:resultIn .35s ease;
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:translateY(9px);
    filter:blur(3px);
  }
  to{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
}

.tags{
  margin-top:14px;
  color:var(--yellow);
  font-size:13px;
  line-height:1.7;
  word-break:break-word;
}

.counter{
  margin-top:13px;
  color:#626262;
  font-size:10px;
  letter-spacing:1px;
}

/* FOOTER */

.footer{
  text-align:center;
  margin-top:28px;
  color:#454545;
  font-size:10px;
  letter-spacing:2px;
}

.footer span{
  color:#777;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:99;
  padding:11px 18px;
  border-radius:999px;
  color:#050505;
  background:var(--yellow);
  font-size:12px;
  font-weight:800;
  box-shadow:
    0 10px 40px rgba(255,210,28,.2);
  opacity:0;
  transform:translate(-50%,20px);
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:650px){

  .container{
    width:92%;
    padding-top:27px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .card{
    padding:16px;
    border-radius:19px;
  }

  h1{
    letter-spacing:-2.5px;
  }

  .subtitle{
    font-size:12px;
  }

  .result{
    min-height:185px;
    padding:18px;
    font-size:16px;
  }

  button{
    flex:1;
    min-width:120px;
  }
}
</style>
</head>

/* =========================================================
   VIBE INFO
   ========================================================= */

const vibeNames = {
  music:"MUSIC",
  hype:"HYPE",
  repeat:"REPEAT",
  beat:"BEAT",
  album:"ALBUM",
  streaming:"STREAMING",
  performance:"PERFORMANCE"
};


/* =========================================================
   USED CAPTIONS
   ========================================================= */

const used = {
  id:{
    music:new Set(),
    hype:new Set(),
    repeat:new Set(),
    beat:new Set(),
    album:new Set(),
    streaming:new Set(),
    performance:new Set()
  },

  en:{
    music:new Set(),
    hype:new Set(),
    repeat:new Set(),
    beat:new Set(),
    album:new Set(),
    streaming:new Set(),
    performance:new Set()
  }
};


let currentCaption = "";


/* =========================================================
   GENERATE
   ========================================================= */

function generateCaption(){

  const language =
    document.getElementById("language").value;

  const vibe =
    document.getElementById("vibe").value;

  const name =
    document.getElementById("name").value.trim() || "LISA";

  const moment =
    document.getElementById("moment").value.trim() || "PRESS PLAY";

  const hashtags =
    document.getElementById("hashtags").value.trim();

  const list =
    captions[language][vibe];

  const usedSet =
    used[language][vibe];


  /* reset kalau semua sudah terpakai */

  if(usedSet.size >= list.length){
    usedSet.clear();
  }


  let index;

  do{
    index =
      Math.floor(Math.random() * list.length);
  }while(usedSet.has(index));


  usedSet.add(index);


  currentCaption =
    list[index]
      .replaceAll("LISA",name)
      .replaceAll("PRESS PLAY",moment);


  const result =
    document.getElementById("result");


  result.classList.remove("show");

  void result.offsetWidth;

  result.textContent =
    currentCaption;

  result.classList.add("show");


  document.getElementById("tags").textContent =
    hashtags;


  document.getElementById("counter").textContent =
    `${usedSet.size} / ${list.length} caption digunakan • ${vibeNames[vibe]} • ${language.toUpperCase()}`;
}


/* =========================================================
   COPY CAPTION
   ========================================================= */

async function copyCaption(){

  if(!currentCaption){
    generateCaption();
  }

  try{

    await navigator.clipboard.writeText(
      currentCaption
    );

    showToast("Caption copied ✓");

  }catch(error){

    fallbackCopy(currentCaption);

  }
}


/* =========================================================
   COPY ALL
   ========================================================= */

async function copyAll(){

  if(!currentCaption){
    generateCaption();
  }

  const hashtags =
    document.getElementById("hashtags")
      .value.trim();

  const finalText =
    hashtags
      ? currentCaption + "\n\n" + hashtags
      : currentCaption;


  try{

    await navigator.clipboard.writeText(
      finalText
    );

    showToast("Caption + tags copied ✓");

  }catch(error){

    fallbackCopy(finalText);

  }
}


/* =========================================================
   FALLBACK COPY
   ========================================================= */

function fallbackCopy(text){

  const textarea =
    document.createElement("textarea");

  textarea.value = text;

  textarea.style.position = "fixed";
  textarea.style.opacity = "0";

  document.body.appendChild(textarea);

  textarea.focus();
  textarea.select();

  document.execCommand("copy");

  textarea.remove();

  showToast("Copied ✓");
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },1800);
}


/* =========================================================
   LANGUAGE / VIBE CHANGE
   ========================================================= */

document
  .getElementById("language")
  .addEventListener("change", updateCounter);

document
  .getElementById("vibe")
  .addEventListener("change", updateCounter);


function updateCounter(){

  const language =
    document.getElementById("language").value;

  const vibe =
    document.getElementById("vibe").value;

  const usedSet =
    used[language][vibe];

  const total =
    captions[language][vibe].length;

  document.getElementById("counter").textContent =
    `${usedSet.size} / ${total} caption digunakan • ${vibeNames[vibe]} • ${language.toUpperCase()}`;

}


/* =========================================================
   INITIAL COUNTER
   ========================================================= */

updateCounter();

</script>
