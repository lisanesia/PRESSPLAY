<!DOCTYPE html>

<title>LISA — PRESS PLAY</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(190,170,255,.22),transparent 35%),
    radial-gradient(circle at 0% 45%,rgba(120,80,180,.10),transparent 30%),
    radial-gradient(circle at 100% 70%,rgba(255,255,255,.06),transparent 25%),
    #050507;
  overflow-x:hidden;
}

/* BACKGROUND GLOW */

body::before,
body::after{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  border-radius:50%;
  filter:blur(100px);
  pointer-events:none;
  z-index:-1;
  opacity:.35;
}

body::before{
  background:#8b6cff;
  top:-180px;
  left:-100px;
  animation:floatOne 10s ease-in-out infinite alternate;
}

body::after{
  background:#ffffff;
  right:-180px;
  bottom:-150px;
  animation:floatTwo 12s ease-in-out infinite alternate;
}

@keyframes floatOne{
  from{transform:translate(0,0)}
  to{transform:translate(100px,80px)}
}

@keyframes floatTwo{
  from{transform:translate(0,0)}
  to{transform:translate(-80px,-60px)}
}

/* PARTICLES */

.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  overflow:hidden;
}

.particles span{
  position:absolute;
  width:3px;
  height:3px;
  background:#fff;
  border-radius:50%;
  opacity:.35;
  animation:particleMove linear infinite;
}

.particles span:nth-child(1){left:8%;top:20%;animation-duration:8s}
.particles span:nth-child(2){left:20%;top:70%;animation-duration:11s}
.particles span:nth-child(3){left:35%;top:30%;animation-duration:9s}
.particles span:nth-child(4){left:50%;top:80%;animation-duration:12s}
.particles span:nth-child(5){left:65%;top:18%;animation-duration:10s}
.particles span:nth-child(6){left:78%;top:55%;animation-duration:8s}
.particles span:nth-child(7){left:90%;top:25%;animation-duration:13s}
.particles span:nth-child(8){left:55%;top:45%;animation-duration:9s}

@keyframes particleMove{
  0%{
    transform:translateY(30px);
    opacity:0;
  }
  30%{
    opacity:.4;
  }
  70%{
    opacity:.2;
  }
  100%{
    transform:translateY(-100px);
    opacity:0;
  }
}

/* CONTAINER */

.container{
  width:min(850px,92%);
  margin:auto;
  padding:45px 0 70px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:35px;
  animation:fadeDown .8s ease;
}

@keyframes fadeDown{
  from{
    opacity:0;
    transform:translateY(-20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.mini{
  display:inline-block;
  font-size:11px;
  letter-spacing:5px;
  color:#c9c3d8;
  margin-bottom:15px;
  padding:7px 14px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:100px;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(10px);
}

h1{
  margin:0;
  font-size:clamp(38px,9vw,68px);
  letter-spacing:-4px;
  line-height:.95;
  background:linear-gradient(
    120deg,
    #ffffff 20%,
    #d6cdfa 50%,
    #ffffff 80%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 35px rgba(180,160,255,.15);
}

.header p{
  color:#898792;
  margin-top:18px;
  font-size:13px;
  letter-spacing:.3px;
}

/* EQUALIZER */

.equalizer{
  height:25px;
  display:flex;
  align-items:end;
  justify-content:center;
  gap:4px;
  margin:22px 0 5px;
}

.equalizer span{
  width:3px;
  border-radius:10px;
  background:#d7d0ef;
  animation:eq .9s ease-in-out infinite alternate;
}

.equalizer span:nth-child(1){height:8px}
.equalizer span:nth-child(2){height:15px;animation-delay:.1s}
.equalizer span:nth-child(3){height:22px;animation-delay:.2s}
.equalizer span:nth-child(4){height:13px;animation-delay:.3s}
.equalizer span:nth-child(5){height:19px;animation-delay:.4s}
.equalizer span:nth-child(6){height:10px;animation-delay:.5s}
.equalizer span:nth-child(7){height:17px;animation-delay:.6s}

@keyframes eq{
  from{transform:scaleY(.45);opacity:.45}
  to{transform:scaleY(1);opacity:1}
}

/* CARD */

.card{
  position:relative;
  background:rgba(15,15,20,.72);
  border:1px solid rgba(255,255,255,.10);
  border-radius:24px;
  padding:22px;
  margin-bottom:17px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  animation:fadeUp .7s ease;
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:24px;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.05),
    transparent 40%
  );
  pointer-events:none;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  color:#aaa8b2;
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:8px;
  font-weight:bold;
}

/* INPUT */

input,
select{
  width:100%;
  padding:14px 15px;
  border-radius:13px;
  border:1px solid #303039;
  background:rgba(7,7,10,.8);
  color:#fff;
  outline:none;
  font-size:14px;
  transition:.25s;
}

input:hover,
select:hover{
  border-color:#484652;
}

input:focus,
select:focus{
  border-color:#9a8bbd;
  box-shadow:0 0 0 3px rgba(150,130,200,.10);
}

/* BUTTONS */

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:20px;
}

button{
  border:1px solid transparent;
  border-radius:13px;
  padding:13px 17px;
  cursor:pointer;
  font-weight:700;
  color:#08080a;
  background:linear-gradient(135deg,#fff,#ddd9e8);
  transition:.25s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(255,255,255,.08);
}

button:active{
  transform:scale(.97);
}

button.secondary{
  background:rgba(255,255,255,.055);
  color:#fff;
  border-color:#35353e;
}

button.secondary:hover{
  border-color:#65616f;
  background:rgba(255,255,255,.09);
}

/* RESULT */

.result{
  min-height:150px;
  padding:21px;
  border-radius:16px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.01)
    );
  border:1px solid rgba(255,255,255,.08);
  font-size:18px;
  line-height:1.7;
  white-space:pre-wrap;
  transition:.3s;
}

.result.show{
  animation:resultPop .35s ease;
}

@keyframes resultPop{
  from{
    opacity:.3;
    transform:scale(.99);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.tags{
  margin-top:14px;
  color:#aaa6b2;
  line-height:1.6;
  word-break:break-word;
}

.counter{
  margin-top:10px;
  color:#62616a;
  font-size:11px;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#55545e;
  font-size:10px;
  letter-spacing:2px;
  margin-top:32px;
}

/* MOBILE */

@media(max-width:650px){

  .container{
    width:90%;
    padding-top:30px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .card{
    padding:17px;
    border-radius:20px;
  }

  h1{
    letter-spacing:-2.5px;
  }

  button{
    flex:1;
    min-width:120px;
  }

  .result{
    font-size:16px;
  }

}

</style>
</head>

/* =========================================================
   VIBE FILTER
========================================================= */

const vibeKeywords = {

  elegan: [
    "era",
    "chapter",
    "color",
    "character",
    "journey",
    "bab",
    "warna",

    "LISA's music, our moment.",
    "New era, new music, still LISA."
  ]

};


/* =========================================================
   GET VIBE CAPTIONS
========================================================= */

function getVibeCaptions(language, vibe){

  const list = captions[language];

  /* SHORT */
  if(vibe === "short"){

    return list.filter(caption =>
      caption.split(/\s+/).length <= 8
    );

  }

  const keywords =
    vibeKeywords[vibe] || [];

  const filtered =
    list.filter(caption => {

      const text =
        caption.toLowerCase();

      return keywords.some(keyword =>
        text.includes(keyword.toLowerCase())
      );

    });

  /*
    Kalau hasil terlalu sedikit,
    tetap gunakan database utama.
  */

  return filtered.length >= 3
    ? filtered
    : list;

}

/* =========================================================
   ANTI-REPEAT
========================================================= */

const used = {
  id:new Set(),
  en:new Set()
};

let currentCaption="";


/* =========================================================
   GENERATE
========================================================= */

function generateCaption(){

  const language =
    document.getElementById("language").value;

  const vibe =
    document.getElementById("vibe").value;

  const name =
    document.getElementById("name").value.trim() || "LISA";

  const moment =
    document.getElementById("moment").value.trim() || "PRESS PLAY";

  const hashtags =
    document.getElementById("hashtags").value.trim();


  /* Ambil caption sesuai VIBE */

  const list =
    getVibeCaptions(language, vibe);


  /*
    Reset kalau semua caption dari vibe
    tersebut sudah pernah digunakan.
  */

  if(used[language].size >= captions[language].length){

    used[language].clear();

  }


  let caption;
  let attempts = 0;


  do{

    const randomIndex =
      Math.floor(Math.random() * list.length);

    caption =
      list[randomIndex];

    attempts++;

  }

  while(
    used[language].has(
      captions[language].indexOf(caption)
    )
    &&
    attempts < 100
  );


  const originalIndex =
    captions[language].indexOf(caption);


  used[language].add(originalIndex);


  currentCaption =
    caption
      .replaceAll("LISA", name)
      .replaceAll("PRESS PLAY", moment);


  const result =
    document.getElementById("result");


  result.classList.remove("show");

  void result.offsetWidth;

  result.classList.add("show");


  result.textContent =
    currentCaption;


  document.getElementById("tags").textContent =
    hashtags;


  document.getElementById("counter").textContent =
    `${used[language].size} / ${captions[language].length} caption digunakan • ${vibe.toUpperCase()}`;

}


  let randomIndex;


  do{

    randomIndex =
      Math.floor(Math.random()*list.length);

  }

  while(
    used[language].has(randomIndex)
  );


  used[language].add(randomIndex);


  currentCaption =
    list[randomIndex]
      .replaceAll("LISA",name)
      .replaceAll("PRESS PLAY",moment);


  const result =
    document.getElementById("result");


  result.classList.remove("show");

  void result.offsetWidth;

  result.classList.add("show");


  result.textContent =
    currentCaption;


  document.getElementById("tags").textContent =
    hashtags;


  document.getElementById("counter").textContent =
    `${used[language].size} / ${list.length} caption digunakan`;

}


/* =========================================================
   COPY
========================================================= */

function copyCaption(){

  if(!currentCaption){

    generateCaption();

  }

  navigator.clipboard.writeText(
    currentCaption
  );

}


function copyAll(){

  if(!currentCaption){

    generateCaption();

  }

  const hashtags =
    document.getElementById("hashtags")
      .value
      .trim();


  const finalText =
    hashtags
      ? currentCaption + "\n\n" + hashtags
      : currentCaption;


  navigator.clipboard.writeText(
    finalText
  );

}
